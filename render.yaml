# Render blueprint - https://render.com/docs/blueprint-spec
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Then set GEMINI_API_KEY in the service's Environment tab.
services:
  - type: web
    name: raenyxbot
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false # set the real value in the Render dashboard, never in git
      - key: PYTHON_VERSION
        value: 3.12.4
